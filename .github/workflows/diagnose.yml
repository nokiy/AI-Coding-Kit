# 🤖 CI failure diagnosis — central reusable triage gate (AI-Coding-Kit#1)
# Called from each repo's ci-diagnose stub on `workflow_run` failure.
# Tier policy (三档分诊):
#   tier 1 · silent   — first failed attempt gets one free retry, no human noise
#   tier 2 · comment  — bot/infra illness or nothing blocked: comment, no @mention
#   tier 3 · decision — blocks a merge / needs an A-B call / recurring: comment + @maintainer
#     (the @mention is the only email channel — GitHub Actions emails are switched off)
name: Diagnose

on:
  workflow_call:
    inputs:
      maintainer:
        description: GitHub login to @mention on tier-3 findings
        type: string
        default: nokiy
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  rerun:
    # Tier 1: a first failure is presumed transient — retry the failed jobs once, silently.
    # The retried run fires workflow_run again with run_attempt=2, which routes to diagnose.
    if: github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run rerun ${{ github.event.workflow_run.id }} --failed -R ${{ github.repository }}

  diagnose:
    # Attempt 2 exactly: the failure survived its free retry — pull logs, locate cause,
    # pick a tier. Attempt 3+ (a human re-running by hand) stays silent: the human is
    # already at the scene, and repeating the diagnosis would just spam the thread.
    if: github.event.workflow_run.run_attempt == 2
    runs-on: ${{ fromJSON(vars.BOT_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: write   # usage ledger (bot-usage branch, where the caller repo keeps one)
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Target: workflow run "${{ github.event.workflow_run.name }}"
            id ${{ github.event.workflow_run.id }} (attempt ${{ github.event.workflow_run.run_attempt }})
            of ${{ github.repository }}, branch `${{ github.event.workflow_run.head_branch }}`,
            conclusion: failure — it already survived one automatic retry, so the cause is real.

            1. Pull the failed logs: `gh run view ${{ github.event.workflow_run.id }} --log-failed`.
               Read the workflow file and recent commits on the branch when the logs alone
               don't explain the failure.
            2. Locate the cause: failing step, file and line, and why it breaks.
            3. Pick a tier:
               - **Tier 2** (comment only): the failing workflow is bot/infra tooling, or the
                 failure blocks no open PR's merge.
               - **Tier 3** (comment + @${{ inputs.maintainer }}): the failure blocks an open
                 PR's merge or acceptance; or the fix needs choosing between approaches; or an
                 earlier diagnosis comment on the same PR/branch already reported this cause.
            4. Write the comment in Chinese with four fixed sections:
               哪里挂了 / 病因（定位到文件:行）/ 问题大小 / 建议修法。
               Tier 3 adds a 需要拍板 section offering concrete A/B options, and puts
               @${{ inputs.maintainer }} on the first body line.
               The comment must open with exactly these two lines:
               `### 🤖 CI 失败诊断`
               `<!-- bot-diagnose: tier-2 -->` (or `tier-3`)
            5. Post it: if the run's branch has an open PR (`gh pr list --head <branch>`),
               comment on that PR. Otherwise comment on the issue titled "🤖 Diagnose Log",
               creating that issue first if it does not exist.

            NEVER change code, NEVER rerun workflows, NEVER add or remove labels.
          claude_args: '--allowedTools "Bash(gh run view:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"'

      # Usage ledger — same shape as the caller repos' other bot workflows; skipped where
      # the caller doesn't keep one.
      - name: Record bot usage
        if: always() && steps.claude.outputs.execution_file != '' && hashFiles('.github/scripts/record-bot-usage.sh') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EF="${{ steps.claude.outputs.execution_file }}"
          IN=$(jq -r '[.[] | select(.type=="result")] | last | .usage.input_tokens // 0' "$EF" 2>/dev/null || echo 0)
          OUT=$(jq -r '[.[] | select(.type=="result")] | last | .usage.output_tokens // 0' "$EF" 2>/dev/null || echo 0)
          COST=$(jq -r '[.[] | select(.type=="result")] | last | .total_cost_usd // 0' "$EF" 2>/dev/null || echo 0)
          bash .github/scripts/record-bot-usage.sh "Diagnose" "${{ github.run_id }}" "$IN" "$OUT" "$COST"
