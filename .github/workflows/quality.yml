# Reusable quality gate — the single source for CI check logic.
# Project ci.yml files are 3-line stubs calling this; edit HERE, never in stubs.
#
# Dual-channel runner (quota-bar ticket #189 pattern): the caller repo's
# CI_RUNNER variable overrides the default — a local scheduled task flips it
# to self-hosted labels when hosted-runner quota runs low. The variable holds
# JSON text (label arrays can only travel as text), hence fromJSON.
#
# Caller stub example (project .github/workflows/ci.yml):
#   name: CI
#   on:
#     pull_request:
#       branches: [dev, main]
#   jobs:
#     quality:
#       uses: nokiy/AI-Coding-Kit/.github/workflows/quality.yml@main
#       with:
#         lint: ./lint.sh
#         build: ./dev.sh build -c release
#         test: ./test.sh
#         runner: '"macos-15"'
name: Quality

on:
  workflow_call:
    inputs:
      lint:
        description: "Lint command (empty = skip); receives CI_BASE_REF to lint only changed files"
        type: string
        default: ""
      build:
        description: "Build command (empty = skip)"
        type: string
        default: ""
      test:
        description: "Test command"
        type: string
        required: true
      runner:
        description: 'Default runner as JSON text, e.g. "macos-15" or "ubuntu-latest"'
        type: string
        default: '"ubuntu-latest"'

# No concurrency group on purpose: any cancellation (in-progress or queued) mails the
# author, while a superseded run that exits green mails nobody — see "Skip if superseded".
jobs:
  quality:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || inputs.runner) }}
    steps:
      - name: Skip if superseded
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          tip=$(gh api "repos/${{ github.repository }}/git/ref/heads/${ref}" --jq .object.sha 2>/dev/null || true)
          mine="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -n "$tip" ] && [ "$tip" != "$mine" ]; then
            echo "superseded by ${tip} — exiting green"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.tip.outputs.skip != 'true'
      # Lint before build: cheapest check first. CI_BASE_REF lets the project's lint
      # command diff against the PR target, so legacy code is never retro-flagged.
      - name: Lint
        if: steps.tip.outputs.skip != 'true' && inputs.lint != ''
        env:
          CI_BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: ${{ inputs.lint }}
      - name: Build
        if: steps.tip.outputs.skip != 'true' && inputs.build != ''
        run: ${{ inputs.build }}
      # One in-job retry: a flake that passes on the second go never becomes a failed
      # run, so it never reaches the mailbox or the diagnosis gate.
      - name: Test
        if: steps.tip.outputs.skip != 'true'
        run: |
          if ${{ inputs.test }}; then exit 0; fi
          echo "::warning::tests failed once — retrying in-job (transient guard)"
          ${{ inputs.test }}
