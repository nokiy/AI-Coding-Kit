# Reusable quality gate — the single source for CI check logic.
# Project ci.yml files are 3-line stubs calling this; edit HERE, never in stubs.
#
# Dual-channel runner (quota-bar ticket #189 pattern): the caller repo's
# CI_RUNNER variable overrides the default — a local scheduled task flips it
# to self-hosted labels when hosted-runner quota runs low. The variable holds
# JSON text (label arrays can only travel as text), hence fromJSON.
#
# Every run also executes the File gate (protocols/file-gate.md) on the PR diff;
# no input turns it off. Pull-request runs add the secrets job: gitleaks over the
# PR's own commits, logs redacted (secret-scan: false turns it off).
#
# Caller stub example (project .github/workflows/ci.yml):
#   name: CI
#   on:
#     pull_request:
#       branches: [dev, main]
#   jobs:
#     quality:
#       uses: nokiy/AI-Coding-Kit/.github/workflows/quality.yml@main
#       with:
#         lint: ./lint.sh
#         build: ./dev.sh build -c release
#         test: ./test.sh
#         runner: '"macos-15"'
#
# Node project stub: pass node-version and plain script names, e.g.
#         node-version: "22"
#         lint: npm run lint && npm run typecheck
#         build: npm run build
#         test: npm test
name: Quality

on:
  workflow_call:
    inputs:
      lint:
        description: "Lint command (empty = skip); receives CI_BASE_REF to lint only changed files"
        type: string
        default: ""
      build:
        description: "Build command (empty = skip)"
        type: string
        default: ""
      test:
        description: "Test command"
        type: string
        required: true
      runner:
        description: 'Default runner as JSON text, e.g. "macos-15" or "ubuntu-latest"'
        type: string
        default: '"ubuntu-latest"'
      node-version:
        description: "Node projects: major version to install (e.g. \"22\"), then npm ci before lint. Empty = skip"
        type: string
        default: ""
      secret-scan:
        description: "Pull requests: gitleaks over the PR's commits (base.sha..head.sha). false = skip"
        type: boolean
        default: true

# No concurrency group on purpose: any cancellation (in-progress or queued) mails the
# author, while a superseded run that exits green mails nobody — see "Skip if superseded".
jobs:
  quality:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || inputs.runner) }}
    steps:
      - name: Skip if superseded
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          tip=$(gh api "repos/${{ github.repository }}/git/ref/heads/${ref}" --jq .object.sha 2>/dev/null || true)
          mine="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -n "$tip" ] && [ "$tip" != "$mine" ]; then
            echo "superseded by ${tip} — exiting green"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.tip.outputs.skip != 'true'
      # File gate (protocols/file-gate.md): every file the PR touches, judged whole —
      # 400 lines, 200 chars per line, no generic file names. Always on, no input skips it.
      # The gate runs from the kit at this workflow's own commit, so a caller pinning
      # @<branch> tests that branch. Empty job.workflow_* would make checkout fall back to
      # the caller repo, so the guard step fails closed first.
      - name: File gate — locate kit
        if: steps.tip.outputs.skip != 'true'
        env:
          KIT_REPO: ${{ job.workflow_repository }}
          KIT_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$KIT_REPO" ] || [ -z "$KIT_SHA" ]; then
            echo "::error::job.workflow_repository / job.workflow_sha empty — cannot locate file-gate"
            exit 1
          fi
          echo "file-gate from ${KIT_REPO}@${KIT_SHA}"
      - uses: actions/checkout@v4
        if: steps.tip.outputs.skip != 'true'
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .file-gate-kit
      # checkout is depth 1: fetch the base and deepen until the merge-base resolves.
      - name: File gate
        if: steps.tip.outputs.skip != 'true'
        env:
          CI_BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          git fetch --no-tags --depth=50 origin "+refs/heads/${CI_BASE_REF}:refs/remotes/origin/${CI_BASE_REF}"
          git fetch --no-tags --depth=50 origin "$(git rev-parse HEAD)" || true
          for step in 1 2 3; do
            git merge-base "origin/${CI_BASE_REF}" HEAD >/dev/null 2>&1 && break
            git fetch --no-tags --deepen=200 origin "+refs/heads/${CI_BASE_REF}:refs/remotes/origin/${CI_BASE_REF}" "$(git rev-parse HEAD)" || true
          done
          if ! git merge-base "origin/${CI_BASE_REF}" HEAD >/dev/null 2>&1 \
             && [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin
          fi
          echo "merge-base: $(git merge-base "origin/${CI_BASE_REF}" HEAD || echo none)"
          # The kit copy is removed afterwards so later lint/build/test steps never see it.
          code=0
          .file-gate-kit/scripts/file-gate/file-gate.sh --base "origin/${CI_BASE_REF}" || code=$?
          rm -rf .file-gate-kit
          exit "$code"
      # Node preset: the same toolchain on hosted and self-hosted runners, whatever the
      # runner image ships. npm ci here keeps project stubs to plain script names.
      - uses: actions/setup-node@v4
        if: steps.tip.outputs.skip != 'true' && inputs.node-version != ''
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install
        if: steps.tip.outputs.skip != 'true' && inputs.node-version != ''
        run: npm ci
      # Lint before build: cheapest check first. CI_BASE_REF lets the project's lint
      # command diff against the PR target, so legacy code is never retro-flagged.
      - name: Lint
        if: steps.tip.outputs.skip != 'true' && inputs.lint != ''
        env:
          CI_BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: ${{ inputs.lint }}
      - name: Build
        if: steps.tip.outputs.skip != 'true' && inputs.build != ''
        run: ${{ inputs.build }}
      # One in-job retry: a flake that passes on the second go never becomes a failed
      # run, so it never reaches the mailbox or the diagnosis gate.
      - name: Test
        if: steps.tip.outputs.skip != 'true'
        run: |
          if ${{ inputs.test }}; then exit 0; fi
          echo "::warning::tests failed once — retrying in-job (transient guard)"
          ${{ inputs.test }}

  # Secrets: gitleaks over exactly the PR's commits, the CI twin of the local
  # commit-secrets hook (same gitleaks version). base.sha..head.sha, not origin/main..HEAD,
  # so dev-based repos scan only their own PR too. Findings print rule + file:line only.
  secrets:
    if: github.event_name == 'pull_request' && inputs.secret-scan
    runs-on: ${{ fromJSON(vars.CI_RUNNER || inputs.runner) }}
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      # Same as the quality job's; the branch name travels via env (untrusted input).
      - name: Skip if superseded
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.head_ref }}
          MINE: ${{ github.event.pull_request.head.sha }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/git/ref/heads/${REF}" --jq .object.sha 2>/dev/null || true)
          if [ -n "$tip" ] && [ "$tip" != "$MINE" ]; then
            echo "superseded by ${tip} — exiting green"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.tip.outputs.skip != 'true'
        with:
          fetch-depth: 0
      # Official release tarball, verified against the same release's checksums file.
      - name: Install gitleaks
        if: steps.tip.outputs.skip != 'true'
        run: |
          case "$RUNNER_OS" in Linux) os=linux ;; macOS) os=darwin ;; *) os="" ;; esac
          case "$RUNNER_ARCH" in X64) arch=x64 ;; ARM64) arch=arm64 ;; *) arch="" ;; esac
          if [ -z "$os" ] || [ -z "$arch" ]; then
            echo "::error::no gitleaks build for ${RUNNER_OS}/${RUNNER_ARCH}"
            exit 1
          fi
          tarball="gitleaks_${GITLEAKS_VERSION}_${os}_${arch}.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$dir" && cd "$dir"
          curl -fsSLO "${url}/${tarball}"
          curl -fsSLO "${url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          if command -v sha256sum >/dev/null; then sha="sha256sum"; else sha="shasum -a 256"; fi
          if ! sum=$(grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt"); then
            echo "::error::${tarball} missing from the release checksums"
            exit 1
          fi
          printf '%s\n' "$sum" | $sha -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version
      # Fail closed: gitleaks exits 0 when its own git call fails, so the range is
      # resolved first. Exit 1 = leaks or a gitleaks error; both fail the job.
      - name: Scan PR commits
        if: steps.tip.outputs.skip != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! count=$(git rev-list --count "${BASE}..${HEAD}"); then
            echo "::error::cannot resolve ${BASE}..${HEAD}"
            exit 1
          fi
          echo "scanning ${count} commit(s): ${BASE}..${HEAD}"
          [ "$count" -gt 0 ] || exit 0
          cfg=()
          [ -f .gitleaks.toml ] && cfg=(--config .gitleaks.toml)
          "${RUNNER_TEMP}/gitleaks/gitleaks" git -v --redact --no-banner --no-color \
            "${cfg[@]}" --log-opts="${BASE}..${HEAD}" .
