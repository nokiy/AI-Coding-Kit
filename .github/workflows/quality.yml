# Reusable quality gate — the single source for CI check logic.
# Project ci.yml files are 3-line stubs calling this; edit HERE, never in stubs.
#
# Dual-channel runner (quota-bar ticket #189 pattern): the caller repo's
# CI_RUNNER variable overrides the default — a local scheduled task flips it
# to self-hosted labels when hosted-runner quota runs low. The variable holds
# JSON text (label arrays can only travel as text), hence fromJSON.
#
# Every run also executes the File gate (protocols/file-gate.md) on the PR diff;
# no input turns it off. Pull-request runs also scan for secrets inside the same job:
# gitleaks over the PR's own commits, in the background beside lint / build / test,
# logs redacted (secret-scan: false turns it off).
#
# Caller stub example (project .github/workflows/ci.yml):
#   name: CI
#   on:
#     pull_request:
#       branches: [dev, main]
#   jobs:
#     quality:
#       uses: nokiy/AI-Coding-Kit/.github/workflows/quality.yml@main
#       with:
#         lint: ./lint.sh
#         build: ./dev.sh build -c release
#         test: ./test.sh
#         runner: '"macos-15"'
#
# Node project stub: pass node-version and plain script names, e.g.
#         node-version: "22"
#         lint: npm run lint && npm run typecheck
#         build: npm run build
#         test: npm test
name: Quality

on:
  workflow_call:
    inputs:
      lint:
        description: "Lint command (empty = skip); receives CI_BASE_REF to lint only changed files"
        type: string
        default: ""
      build:
        description: "Build command (empty = skip)"
        type: string
        default: ""
      test:
        description: "Test command"
        type: string
        required: true
      runner:
        description: 'Default runner as JSON text, e.g. "macos-15" or "ubuntu-latest"'
        type: string
        default: '"ubuntu-latest"'
      node-version:
        description: "Node projects: major version to install (e.g. \"22\"), then npm ci before lint. Empty = skip"
        type: string
        default: ""
      secret-scan:
        description: "Pull requests: gitleaks over the PR's commits (base.sha..head.sha). false = skip"
        type: boolean
        default: true

# No concurrency group on purpose: any cancellation (in-progress or queued) mails the
# author, while a superseded run that exits green mails nobody — see "Skip if superseded".
jobs:
  quality:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || inputs.runner) }}
    steps:
      - name: Skip if superseded
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          tip=$(gh api "repos/${{ github.repository }}/git/ref/heads/${ref}" --jq .object.sha 2>/dev/null || true)
          mine="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -n "$tip" ] && [ "$tip" != "$mine" ]; then
            echo "superseded by ${tip} — exiting green"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.tip.outputs.skip != 'true'
      # Kit scripts (File gate, Secret scan) run from the kit at this workflow's own commit,
      # so a caller pinning @<branch> tests that branch. Empty job.workflow_* would make
      # checkout fall back to the caller repo, so the guard step fails closed first.
      - name: Kit — locate
        if: steps.tip.outputs.skip != 'true'
        env:
          KIT_REPO: ${{ job.workflow_repository }}
          KIT_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$KIT_REPO" ] || [ -z "$KIT_SHA" ]; then
            echo "::error::job.workflow_repository / job.workflow_sha empty — cannot locate the kit"
            exit 1
          fi
          echo "kit from ${KIT_REPO}@${KIT_SHA}"
      - uses: actions/checkout@v4
        if: steps.tip.outputs.skip != 'true'
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-kit
          persist-credentials: false
      # checkout only writes under the workspace; the copy moves to $RUNNER_TEMP at once,
      # so lint/build/test never see a kit copy inside the workspace.
      - name: Kit — move out of workspace
        if: steps.tip.outputs.skip != 'true'
        run: |
          rm -rf "$RUNNER_TEMP/ci-kit"
          mv .ci-kit "$RUNNER_TEMP/ci-kit"
      # File gate (protocols/file-gate.md): every file the PR touches, judged whole —
      # 400 lines, 200 chars per line, no generic file names. Always on, no input skips it.
      # checkout is depth 1: fetch the base and deepen until the merge-base resolves.
      - name: File gate
        if: steps.tip.outputs.skip != 'true'
        env:
          CI_BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          git fetch --no-tags --depth=50 origin "+refs/heads/${CI_BASE_REF}:refs/remotes/origin/${CI_BASE_REF}"
          git fetch --no-tags --depth=50 origin "$(git rev-parse HEAD)" || true
          for step in 1 2 3; do
            git merge-base "origin/${CI_BASE_REF}" HEAD >/dev/null 2>&1 && break
            git fetch --no-tags --deepen=200 origin "+refs/heads/${CI_BASE_REF}:refs/remotes/origin/${CI_BASE_REF}" "$(git rev-parse HEAD)" || true
          done
          if ! git merge-base "origin/${CI_BASE_REF}" HEAD >/dev/null 2>&1 \
             && [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin
          fi
          echo "merge-base: $(git merge-base "origin/${CI_BASE_REF}" HEAD || echo none)"
          "$RUNNER_TEMP/ci-kit/scripts/file-gate/file-gate.sh" --base "origin/${CI_BASE_REF}"
      # Secrets: scripts/secret-scan/secret-scan.sh (the CI twin of the local commit-secrets
      # hook) over exactly the PR's commits. base.sha..head.sha, not origin/main..HEAD, so
      # dev-based repos scan only their own PR too. Findings print rule + file:line only.
      # All fetching happens here, in the foreground; the scan itself then runs in the
      # background beside lint / build / test and "Secret scan — result" collects it.
      # HEAD is the synthetic merge commit, so the File gate's merge-base resolves without
      # deepening the PR side; the range needs merge-base(base.sha, head.sha) instead, or
      # rev-list would silently stop at the shallow boundary.
      - name: Secret scan — start
        id: scan
        if: steps.tip.outputs.skip != 'true' && github.event_name == 'pull_request' && inputs.secret-scan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          for sha in "$BASE" "$HEAD"; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags --depth=50 origin "$sha" || true
          done
          for _ in 1 2 3; do
            git merge-base "$BASE" "$HEAD" >/dev/null 2>&1 && break
            git fetch --no-tags --deepen=200 origin "$BASE" "$HEAD" || true
          done
          if ! git merge-base "$BASE" "$HEAD" >/dev/null 2>&1 \
             && [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin
          fi
          echo "merge-base: $(git merge-base "$BASE" "$HEAD" || echo none)"
          out="$RUNNER_TEMP/secret-scan.out"; code="$RUNNER_TEMP/secret-scan.code"
          rm -f "$out" "$code" "$code.tmp"
          # Every fd redirected: the runner waits for the step's stdout/stderr to close.
          # shellcheck disable=SC2016  # expanded by the inner bash, from the step's env
          nohup bash -c 'cd "$GITHUB_WORKSPACE" || exit 2
            "$RUNNER_TEMP/ci-kit/scripts/secret-scan/secret-scan.sh" "$BASE" "$HEAD" >"$1" 2>&1
            echo $? >"$2.tmp" && mv "$2.tmp" "$2"' secret-scan "$out" "$code" \
            </dev/null >/dev/null 2>&1 &
          echo "secret scan running in the background (pid $!)"
      # Node preset: the same toolchain on hosted and self-hosted runners, whatever the
      # runner image ships. npm ci here keeps project stubs to plain script names.
      - uses: actions/setup-node@v4
        if: steps.tip.outputs.skip != 'true' && inputs.node-version != ''
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install
        if: steps.tip.outputs.skip != 'true' && inputs.node-version != ''
        run: npm ci
      # Lint before build: cheapest check first. CI_BASE_REF lets the project's lint
      # command diff against the PR target, so legacy code is never retro-flagged.
      - name: Lint
        if: steps.tip.outputs.skip != 'true' && inputs.lint != ''
        env:
          CI_BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: ${{ inputs.lint }}
      - name: Build
        if: steps.tip.outputs.skip != 'true' && inputs.build != ''
        run: ${{ inputs.build }}
      # One in-job retry: a flake that passes on the second go never becomes a failed
      # run, so it never reaches the mailbox or the diagnosis gate.
      - name: Test
        if: steps.tip.outputs.skip != 'true'
        run: |
          if ${{ inputs.test }}; then exit 0; fi
          echo "::warning::tests failed once — retrying in-job (transient guard)"
          ${{ inputs.test }}
      # always(): a leak is reported even when lint / build / test are red. Gated on the
      # start step's success, so a red File gate never adds a misleading timeout here.
      # Exit 1 = leaks or a gitleaks error, 2 = unresolvable range or install failure.
      - name: Secret scan — result
        if: >-
          always() && steps.tip.outputs.skip != 'true' && github.event_name == 'pull_request'
          && inputs.secret-scan && steps.scan.outcome == 'success'
        run: |
          out="$RUNNER_TEMP/secret-scan.out"; code="$RUNNER_TEMP/secret-scan.code"
          for _ in $(seq 1 300); do
            [ -f "$code" ] && break
            sleep 1
          done
          [ -f "$out" ] && cat "$out"
          if [ ! -f "$code" ]; then
            echo "::error::secret scan did not finish within 300 s of the result step"
            exit 2
          fi
          rc=$(cat "$code")
          case "$rc" in
            0) echo "secret scan clean" ;;
            1) echo "::error::secret scan: leaks found or gitleaks failed (see above)" ;;
            *) echo "::error::secret scan: range unresolvable or gitleaks install failed (exit ${rc})" ;;
          esac
          exit "$rc"
