# Kit self-test: every PR into master runs the reusable quality gate against this repo,
# so the File gate step judges the PR's own files, the Secret scan steps scan the PR's own
# commits (clean path), and the test scripts prove file-gate.sh and secret-scan.sh on Linux
# (default runner ubuntu-latest) — secret-scan's test.sh asserts the leak path goes red — and
# full-suite's test.sh and release-gate-check.test.sh prove the nightly flow's and the release gate's GitHub calls
# against a fake gh.
name: Self-test

on:
  pull_request:
    branches: [master]

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      test: ./scripts/file-gate/test.sh && ./scripts/secret-scan/test.sh && ./scripts/full-suite/test.sh && ./scripts/project/release-gate-check.test.sh
