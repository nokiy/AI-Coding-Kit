# Kit self-test: every PR into master runs the reusable quality gate against this repo,
# so the File gate step judges the PR's own files, the secrets job scans the PR's own
# commits (clean path), and the test scripts prove file-gate.sh and secret-scan.sh on Linux
# (default runner ubuntu-latest) — secret-scan's test.sh asserts the leak path goes red.
name: Self-test

on:
  pull_request:
    branches: [master]

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      test: ./scripts/file-gate/test.sh && ./scripts/secret-scan/test.sh
