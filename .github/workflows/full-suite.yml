# Reusable full suite: the central nightly flow. Project stubs give the commands and the runner; every judgement
# lives here and in scripts/full-suite/full-suite.sh (its header).
# Started only by workflow_dispatch (dots at 04:30 Taiwan time, the 「发版」 step): no schedule, because merging a PR
# must never start a full run and a sleeping self-hosted runner (niko-mac) would only pile cron runs up.
# A commit that already has a final full-suite status is not tested again, so a second trigger costs seconds.
# issue-filer external: a reviewer agent files the nightly-red issue; the backstop step files one for a red it left
# unfiled past review-window, on every run, because a red commit is rarely retriggered once the branch moves on.
# Runner: the runner input only, never vars.CI_RUNNER (that routes PR CI). The runner needs bash and gh.
# The token lives only on the helper steps: build and test never see it.
#
# Caller stub (project .github/workflows/full-suite.yml); the caller grants these permissions:
#   name: Full suite
#   on:
#     workflow_dispatch:              # dots at 04:30 Asia/Taipei; the 「发版」 step when main is untested
#       inputs:
#         ref: { description: "Branch, tag or sha (empty = default branch)", default: "" }
#         force: { description: "Test even if this commit was tested", type: boolean, default: false }
#   permissions:
#     contents: read
#     statuses: write
#     issues: write
#     pull-requests: read
#   jobs:
#     full:
#       uses: nokiy/AI-Coding-Kit/.github/workflows/full-suite.yml@master
#       with:
#         build: ./dev.sh build
#         test: ./swift-test.sh
#         runner: '["self-hosted","local-mac"]'
#         issue-filer: external
#         ref: ${{ inputs.ref || '' }}
#         force: ${{ inputs.force || false }}
# Private dependencies: private-deps + secret deps-token, the same contract as quality.yml.
name: Full suite

on:
  workflow_call:
    inputs:
      build:
        description: "Build command, the way the project ships (empty = skip)"
        type: string
        default: ""
      test:
        description: "Full test command; rerun once as a whole when it fails"
        type: string
        required: true
      runner:
        description: 'Runner as JSON text, e.g. "ubuntu-latest" or ["self-hosted","local-mac"]'
        type: string
        default: '"ubuntu-latest"'
      ref:
        description: "Branch, tag or sha to test (empty = the repo's default branch)"
        type: string
        default: ""
      force:
        description: "Test even when the commit already has a final full-suite status"
        type: boolean
        default: false
      issue-filer:
        description: "central = this workflow opens / comments / closes issues; external = a reviewer agent does"
        type: string
        default: central
      review-window:
        description: "external: minutes a red commit waits for a reviewed nightly-red issue before the backstop files one"
        type: number
        default: 120
      timeout-minutes:
        description: "Job timeout"
        type: number
        default: 90
      private-deps:
        description: "Space-separated https://github.com/ URL prefixes fetched with secret deps-token (empty = skip)"
        type: string
        default: ""
    secrets:
      deps-token:
        description: "Read-only token for the private-deps URLs"
        required: false
    outputs:
      result:
        description: "skipped | green | flaky | red"
        value: ${{ jobs.full-suite.outputs.result }}
      sha:
        description: "The commit tested (or skipped)"
        value: ${{ jobs.full-suite.outputs.sha }}

jobs:
  full-suite:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Two triggers for one ref (dots and the 「发版」 step) queue; the second then skips.
    concurrency:
      group: full-suite-${{ github.repository }}-${{ inputs.ref || 'default' }}
      cancel-in-progress: false
    outputs:
      result: ${{ steps.verdict.outputs.result }}
      sha: ${{ steps.target.outputs.sha }}
    # The token and the helper's variables live only on the helper steps: build and test never see them.
    steps:
      # The kit at this workflow's own commit, moved out of the workspace (same pattern as quality.yml).
      - name: Kit — locate
        env:
          KIT_REPO: ${{ job.workflow_repository }}
          KIT_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$KIT_REPO" ] || [ -z "$KIT_SHA" ]; then
            echo "::error::job.workflow_repository / job.workflow_sha empty — cannot locate the kit"
            exit 1
          fi
          echo "kit from ${KIT_REPO}@${KIT_SHA}"
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-kit
          persist-credentials: false
          sparse-checkout: |
            scripts/full-suite
            scripts/project
      - name: Kit — move out of workspace
        run: |
          rm -rf "$RUNNER_TEMP/ci-kit"
          mv .ci-kit "$RUNNER_TEMP/ci-kit"
      - name: Tested already?
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ inputs.ref }}
          FORCE: ${{ inputs.force }}
        run: |
          [ -n "$REF" ] || REF=$(gh api "repos/$GH_REPO" --jq .default_branch)
          sha=$(gh api "repos/$GH_REPO/commits/$REF" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          export SHA=$sha FS="$RUNNER_TEMP/ci-kit/scripts/full-suite/full-suite.sh"
          seen=$("$FS" seen)
          echo "$REF → $sha · $seen"
          case "$seen" in
            state=success*|state=failure*)
              if [ "$FORCE" != true ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "Full suite skipped: $sha already tested (${seen})." >> "$GITHUB_STEP_SUMMARY"
              fi ;;
          esac
      - name: Mark pending
        if: steps.target.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ steps.target.outputs.sha }}
        run: '"$RUNNER_TEMP/ci-kit/scripts/full-suite/full-suite.sh" mark pending "全量进行中"'
      # No token in .git/config: build and test run the project's own code. Later steps reach GitHub via gh + GH_TOKEN.
      - uses: actions/checkout@v4
        if: steps.target.outputs.skip != 'true'
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
      - name: Private deps — credentials
        if: steps.target.outputs.skip != 'true' && inputs.private-deps != ''
        env:
          DEPS_TOKEN: ${{ secrets.deps-token }}
          PRIVATE_DEPS: ${{ inputs.private-deps }}
        run: |
          if [ -z "$DEPS_TOKEN" ]; then
            echo "::warning::private-deps is set but secret deps-token is empty: ${PRIVATE_DEPS}"
            exit 0
          fi
          echo "::add-mask::${DEPS_TOKEN}"
          n=${GIT_CONFIG_COUNT:-0}
          for prefix in $PRIVATE_DEPS; do
            case "$prefix" in
              https://github.com/?*) ;;
              *) echo "::error::private-deps: ${prefix} is not an https://github.com/ URL"; exit 1 ;;
            esac
            {
              echo "GIT_CONFIG_KEY_${n}=url.https://x-access-token:${DEPS_TOKEN}@${prefix#https://}.insteadOf"
              echo "GIT_CONFIG_VALUE_${n}=${prefix}"
            } >> "$GITHUB_ENV"
            n=$((n + 1))
          done
          echo "GIT_CONFIG_COUNT=${n}" >> "$GITHUB_ENV"
      # Never fails on its own: the verdict decides, after the status and issues are written.
      - name: Build and test
        id: run
        if: steps.target.outputs.skip != 'true'
        env:
          BUILD_CMD: ${{ inputs.build }}
          TEST_CMD: ${{ inputs.test }}
        run: |
          "$RUNNER_TEMP/ci-kit/scripts/full-suite/full-suite.sh" run | tee "$RUNNER_TEMP/full-suite-run.out"
          grep '^verdict=' "$RUNNER_TEMP/full-suite-run.out" | tail -n1 >> "$GITHUB_OUTPUT"
      - name: Status and issues
        if: steps.run.outputs.verdict != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FILER: ${{ inputs.issue-filer }}
          SHA: ${{ steps.target.outputs.sha }}
          VERDICT: ${{ steps.run.outputs.verdict }}
        run: '"$RUNNER_TEMP/ci-kit/scripts/full-suite/full-suite.sh" report "$VERDICT"'
      # Release gate (release-gate.yml): a fresh result on the default branch HEAD is copied onto the open release PR.
      # Never fails the job: the verdict below stays the full-suite result.
      - name: Release gate
        if: steps.run.outputs.verdict != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          base=$(gh api "repos/$GH_REPO" --jq .default_branch)
          if [ "$(gh api "repos/$GH_REPO/commits/$base" --jq .sha)" = "$SHA" ]; then
            BRANCH=$base "$RUNNER_TEMP/ci-kit/scripts/project/release-gate-check.sh" sync
          else
            echo "tested $SHA is not the $base HEAD: release gate left as it is"
          fi
      # Tested or skipped, whichever commit: a default-branch red nobody filed within review-window gets its issue.
      - name: Backstop
        if: always() && inputs.issue-filer == 'external' && steps.target.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FILER: ${{ inputs.issue-filer }}
          WINDOW_MIN: ${{ inputs.review-window }}
        run: '"$RUNNER_TEMP/ci-kit/scripts/full-suite/full-suite.sh" backstop'
      - name: Verdict
        id: verdict
        if: always()
        env:
          SKIP: ${{ steps.target.outputs.skip }}
          SHA: ${{ steps.target.outputs.sha }}
          VERDICT: ${{ steps.run.outputs.verdict }}
        run: |
          result=${VERDICT:-none}
          [ "$SKIP" = true ] && result=skipped
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "Full suite: ${result} on ${SHA:-?}" >> "$GITHUB_STEP_SUMMARY"
          case "$result" in skipped|green|flaky) exit 0 ;; *) exit 1 ;; esac
